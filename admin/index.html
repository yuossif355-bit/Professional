<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0b16">
<title>سجل الاشتراكات | Professional Academy</title>
<link rel="icon" type="image/png" href="../img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b16;--panel:#16132a;--panel-2:#1e1a38;--line:#322d55;--text:#f6f4ff;--muted:#a9a4c7;--or:#fbbf24;--or-2:#fde68a;--ok:#4be28a;--bad:#ff7b72;--grad:linear-gradient(90deg,#34d399,#fbbf24,#a78bfa)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,sans-serif;line-height:1.6;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.head{display:flex;align-items:center;gap:12px;padding:18px 0 6px}
.head img{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px var(--or)}
body{border-top:4px solid transparent;border-image:var(--grad) 1}
.m{border-inline-start:6px solid var(--c,var(--line))}
.head h1{font-size:1.3rem;font-weight:900;line-height:1.25}
.head p{color:var(--or-2);font-size:.85rem;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.card h2{font-size:1.05rem;color:var(--or);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem;font-weight:700}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
input,select{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--or)}
.btn{background:var(--grad);color:#111;border:0;border-radius:12px;padding:10px 16px;font-weight:900}
.btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-weight:700}
.btn.sm{padding:6px 12px;font-size:.88rem}
.list{display:grid;gap:8px;margin-top:10px}
.m{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.m.paid{border-color:rgba(75,226,138,.5)}
.m .n{font-weight:900}
.m .s{color:var(--muted);font-size:.82rem;grid-column:1}
.m .when{color:var(--ok);font-size:.8rem;font-weight:700;grid-column:1}
.pay{grid-row:1/span 2;grid-column:2;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px;font-weight:900;min-width:92px}
.paid .pay{background:var(--ok);border-color:var(--ok);color:#06210f}
.tools{display:flex;gap:6px;grid-column:1/-1;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.note{color:var(--muted);font-size:.82rem;margin-top:10px;line-height:1.8}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;max-width:340px;background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;font-weight:700;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <img src="../img/logo.jpg" alt="" width="52" height="52">
    <div><h1>سجل الاشتراكات</h1><p>مين دفع ومين لسه</p></div>
  </header>

  <section class="card" aria-label="الشهر">
    <div class="row">
      <input type="month" id="month" aria-label="الشهر">
      <select id="fSport" aria-label="اللعبة"><option value="">كل الألعاب</option></select>
      <select id="fStatus" aria-label="الحالة">
        <option value="">الكل</option><option value="paid">دفعوا</option><option value="unpaid">لسه</option>
      </select>
    </div>
    <div class="row" style="margin-top:8px"><input type="search" id="q" placeholder="ابحث بالاسم أو الرقم" aria-label="بحث"></div>
  </section>

  <div class="stats" aria-live="polite">
    <div class="stat"><b id="tAll">0</b><span>إجمالي اللاعبين</span></div>
    <div class="stat ok"><b id="tPaid">0</b><span>دفعوا</span></div>
    <div class="stat bad"><b id="tUnpaid">0</b><span>لسه</span></div>
  </div>

  <section class="card" aria-label="اللاعبين">
    <div class="list" id="list"></div>
  </section>

  <section class="card" aria-labelledby="addH">
    <h2 id="addH">إضافة لاعب</h2>
    <form id="add" novalidate>
      <div class="row">
        <input id="aName" placeholder="اسم اللاعب" maxlength="40" aria-label="اسم اللاعب">
        <input id="aPhone" type="tel" inputmode="tel" dir="ltr" placeholder="رقم الموبايل" aria-label="رقم الموبايل" style="text-align:start">
      </div>
      <div class="row" style="margin-top:8px">
        <select id="aSport" aria-label="اللعبة"></select>
        <select id="aGroup" aria-label="المجموعة"><option>الأولاد</option><option>البنات</option></select>
        <button class="btn" type="submit">إضافة</button>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="bkH">
    <h2 id="bkH">نسخة احتياطية</h2>
    <div class="row">
      <button class="btn ghost" id="csv" type="button">تصدير Excel (CSV)</button>
      <button class="btn ghost" id="bk" type="button">حفظ نسخة</button>
      <button class="btn ghost" id="rs" type="button">استرجاع نسخة</button>
    </div>
    <input type="file" id="file" accept="application/json" hidden>
    <p class="note">البيانات محفوظة على جهازك إنت بس ومبتتبعتش لأي سيرفر، يعني محدش غيرك يشوفها. لو مسحت بيانات المتصفح أو غيرت الموبايل هتضيع، فاعمل "حفظ نسخة" كل فترة.</p>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var SPORTS=[{id:"handball",name:"كرة اليد",color:"#34d399"},{id:"basketball",name:"كرة السلة",color:"#fbbf24"},{id:"volleyball",name:"الكرة الطائرة",color:"#a78bfa"}];
  function sportColor(id){var s=SPORTS.filter(function(x){return x.id===id})[0];return s?s.color:"#322d55"}
  var KEY="pa_subs_v1";
  var $=function(s){return document.querySelector(s)};
  var db={members:[]}; /* member: {id,name,phone,sport,group,paid:{"2026-10":"2026-10-24"}} */
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&Array.isArray(d.members))db=d}catch(e){}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("مقدرتش أحفظ. المتصفح مانع التخزين.")}}
  function toast(m){var e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove("show")},2400)}
  function sportName(id){var s=SPORTS.filter(function(x){return x.id===id})[0];return s?s.name:id}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function fmt(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"long"})}catch(e){return iso}}

  var month=$("#month");month.value=today().slice(0,7);
  SPORTS.forEach(function(s){
    var o=el("option",null,s.name);o.value=s.id;$("#aSport").appendChild(o);
    var o2=el("option",null,s.name);o2.value=s.id;$("#fSport").appendChild(o2);
  });

  function visible(){
    var m=month.value,sp=$("#fSport").value,st=$("#fStatus").value,q=$("#q").value.trim().toLowerCase();
    return db.members.filter(function(x){
      if(sp&&x.sport!==sp)return false;
      var p=!!(x.paid&&x.paid[m]);
      if(st==="paid"&&!p)return false;
      if(st==="unpaid"&&p)return false;
      if(q&&(x.name+" "+x.phone).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
  }
  function render(){
    var m=month.value,list=$("#list");
    while(list.firstChild)list.removeChild(list.firstChild);
    var sp=$("#fSport").value;
    var base=db.members.filter(function(x){return !sp||x.sport===sp});
    var paid=base.filter(function(x){return x.paid&&x.paid[m]}).length;
    $("#tAll").textContent=base.length;$("#tPaid").textContent=paid;$("#tUnpaid").textContent=base.length-paid;
    var rows=visible();
    if(!rows.length){list.appendChild(el("p","empty",db.members.length?"مفيش نتايج.":"ضيف أول لاعب من تحت."));return}
    rows.sort(function(a,b){return a.name.localeCompare(b.name,"ar")});
    rows.forEach(function(x){
      var p=x.paid&&x.paid[m],card=el("div","m"+(p?" paid":""));
      card.style.setProperty("--c",sportColor(x.sport));card.appendChild(el("div","n",x.name));
      card.appendChild(el("div","s",sportName(x.sport)+" · "+x.group+(x.phone?" · "+x.phone:"")));
      if(p)card.appendChild(el("div","when","اتدفع يوم "+fmt(p)));
      var b=el("button","pay",p?"✓ دفع":"لسه");b.type="button";
      b.setAttribute("aria-pressed",p?"true":"false");b.setAttribute("aria-label",x.name+": "+(p?"دفع":"لسه"));
      b.addEventListener("click",function(){
        x.paid=x.paid||{};
        if(x.paid[m])delete x.paid[m];else x.paid[m]=today();
        save();render();
      });
      card.appendChild(b);
      var t=el("div","tools");
      var rm=el("button","btn ghost sm","حذف");rm.type="button";
      rm.addEventListener("click",function(){
        if(confirm("تحذف "+x.name+" وكل سجل دفعه؟")){db.members=db.members.filter(function(y){return y.id!==x.id});save();render()}
      });
      t.appendChild(rm);card.appendChild(t);
      list.appendChild(card);
    });
  }

  $("#add").addEventListener("submit",function(e){
    e.preventDefault();
    var name=$("#aName").value.trim(),ph=$("#aPhone").value.replace(/[\s-]/g,"");
    if(!name){toast("اكتب اسم اللاعب");return}
    if(ph&&!/^01[0125]\d{8}$/.test(ph)){toast("رقم الموبايل مش مظبوط");return}
    db.members.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,phone:ph,sport:$("#aSport").value,group:$("#aGroup").value,paid:{}});
    save();$("#aName").value="";$("#aPhone").value="";render();toast("تمت إضافة "+name);
  });
  [month,$("#fSport"),$("#fStatus")].forEach(function(c){c.addEventListener("change",render)});
  $("#q").addEventListener("input",render);

  function download(name,type,text){
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  }
  function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
  $("#csv").addEventListener("click",function(){
    var m=month.value,rows=[["الاسم","الموبايل","اللعبة","المجموعة","الشهر","الحالة","تاريخ الدفع"]];
    visible().forEach(function(x){var p=x.paid&&x.paid[m];rows.push([x.name,x.phone,sportName(x.sport),x.group,m,p?"دفع":"لسه",p||""])});
    download("subscriptions-"+m+".csv","text/csv;charset=utf-8","﻿"+rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n"));
  });
  $("#bk").addEventListener("click",function(){download("professional-backup-"+today()+".json","application/json",JSON.stringify(db))});
  $("#rs").addEventListener("click",function(){$("#file").click()});
  $("#file").addEventListener("change",function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);if(!d||!Array.isArray(d.members))throw 0;
        if(confirm("هيتم استبدال البيانات الحالية بالنسخة دي ("+d.members.length+" لاعب). تكمل؟")){db=d;save();render();toast("تم الاسترجاع")}
      }catch(x){toast("الملف مش نسخة صحيحة")}
      e.target.value="";
    };
    r.readAsText(f);
  });

  load();render();
})();
</script>
</body>
</html>
